name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Unzip project
      run: |
        unzip -o Daftar_Siyanat_Android_Project.zip -d extracted_project

    - name: Build APK with Gradle
      run: |
        # البحث عن المجلد الذي يحتوي على ملف build.gradle أو build.gradle.kts
        BUILD_FILE=$(find extracted_project -name "build.gradle" -o -name "build.gradle.kts" | head -n 1)
        if [ -n "$BUILD_FILE" ]; then
          PROJECT_DIR=$(dirname "$BUILD_FILE")
          cd "$PROJECT_DIR"
          
          # إذا كان gradlew موجوداً نستخدمه، وإلا نستخدم gradle المثبت في السيرفر
          if [ -f "./gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi
        else
          echo "Error: No build.gradle file found in the zip archive!"
          exit 1
        fi

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: '**/build/outputs/apk/debug/*.apk'
        

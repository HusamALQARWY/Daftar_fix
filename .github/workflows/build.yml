name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Unzip project archive
      run: |
        # العثور على أي ملف zip مرفوع وفك ضغطه تلقائياً بغض النظر عن اسمه
        ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
        if [ -n "$ZIP_FILE" ]; then
          echo "Unzipping $ZIP_FILE..."
          unzip -o "$ZIP_FILE" -d extracted_project
        else
          echo "Error: No .zip file found in root directory!"
          exit 1
        fi

    - name: Build APK with Gradle
      run: |
        BUILD_FILE=$(find extracted_project -name "build.gradle" -o -name "build.gradle.kts" | head -n 1)
        if [ -n "$BUILD_FILE" ]; then
          PROJECT_DIR=$(dirname "$BUILD_FILE")
          cd "$PROJECT_DIR"
          
          # إجبار التحديث إلى إصدار Gradle 8.9 المتوافق
          gradle wrapper --gradle-version 8.9
          
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
        else
          echo "Error: No build file found inside the extracted zip!"
          exit 1
        fi

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: '**/build/outputs/apk/debug/*.apk'

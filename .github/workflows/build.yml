name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Unzip project
      run: |
        unzip -o Daftar_Siyanat_Android_Project.zip -d extracted_project

    - name: Make gradlew executable
      run: |
        find extracted_project -name "gradlew" -exec chmod +x {} \;

    - name: Build APK with Gradle
      run: |
        PROJECT_DIR=$(find extracted_project -name "gradlew" -printf "%h\n" | head -n 1)
        if [ -n "$PROJECT_DIR" ]; then
          cd "$PROJECT_DIR"
          ./gradlew assembleDebug --stacktrace
        else
          echo "gradlew not found, trying root directory..."
          cd extracted_project
          gradle assembleDebug
        fi

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: '**/build/outputs/apk/debug/*.apk'

name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Unzip project
      run: |
        unzip -o Daftar_Siyanat_Android_Project.zip -d extracted_project

    - name: Build APK with Gradle
      run: |
        BUILD_FILE=$(find extracted_project -name "build.gradle" -o -name "build.gradle.kts" | head -n 1)
        if [ -n "$BUILD_FILE" ]; then
          PROJECT_DIR=$(dirname "$BUILD_FILE")
          cd "$PROJECT_DIR"
          
          # تحديث ملف الـ wrapper إلى إصدار متوافق 8.9
          gradle wrapper --gradle-version 8.9
          
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace -Pandroid.enableJetifier=true -Pandroid.useAndroidX=true
        else
          echo "Error: No build file found!"
          exit 1
        fi

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: '**/build/outputs/apk/debug/*.apk'
        
